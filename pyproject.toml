[project]
name = "dataagent"
version = "0.1.0"
description = "AI-powered Dremio synthetic training-data generator for Qwen3.5-0.8B text-to-SQL SFT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlglot>=25.0",
    "jsonschema>=4.22",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]
openai = ["openai>=1.40"]
semantic = ["chromadb>=1.0"]  # optional embedding-based near-duplicate detection

[project.scripts]
dataagent = "dataagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
